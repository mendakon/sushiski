services:
  web:
    build: .
    restart: always
#     links:
#       - db
#       - redis
# #     - mcaptcha
# #     - meilisearch
    depends_on:
      # db:
      #   condition: service_healthy
      redis:
        condition: service_healthy
    # ports:
    #   - "3000:3000"
    networks:
      - internal_network
      - external_network
    env_file:
      - .config/docker.env
    volumes:
      - ./files:/misskey/files
      - ./.config:/misskey/.config:ro

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - internal_network
      - external_network
    volumes:
      - ./redis:/data
      - ./.config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    env_file:
      - .config/docker.env
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      retries: 20

