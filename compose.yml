  meilisearch:
    restart: always
    image: getmeili/meilisearch:v1.3.4
    ports:
      - "7700:7700" 
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    env_file:
      - .config/docker.env
    networks:
      - internal_network
      - external_network
    volumes:
      - ./meili_data:/meili_data


  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - web
    networks:
      - external_network
      - internal_network

networks:
  internal_network:
    internal: true
  external_network:
