services:
  web:
    build: .
    container_name: sushiski-web
    user: misskey
    restart: always
    working_dir: /misskey

    env_file:
      - .config/docker.env
    environment:
      NODE_ENV: production
      # V8 heap / GC / event-loop metrics (worker:9102 master:9103), scrape on monitoring net only
      NODE_OPTIONS: "--require /misskey/monitoring-preload.cjs"

    volumes:
      - /home/misskey/sushiski/files:/misskey/files:rw
      - /home/misskey/sushiski/.config:/misskey/.config:ro
      - /home/misskey/sushiski/monitoring/misskey-node-preload/preload.cjs:/misskey/monitoring-preload.cjs:ro

    healthcheck:
      test: ["CMD", "/bin/bash", "/misskey/healthcheck.sh"]
      interval: 5s
      retries: 20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sushiski_internal_network
      - sushiski_external_network
      - monitoring

    depends_on:
      redis:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    container_name: sushiski-nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /home/misskey/sushiski/nginx/conf.d:/etc/nginx/conf.d:ro
      - /home/misskey/sushiski/cloudflare:/etc/ssl/cloudflare:ro
      - /home/misskey/sushiski/nginx/logs:/var/log/nginx/misskey:rw

    depends_on:
      web:
        condition: service_started

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sushiski_external_network
      - sushiski_internal_network


  redis:
    image: redis:7-alpine
    container_name: sushiski-redis
    restart: always

    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    working_dir: /data

    volumes:
      - /home/misskey/sushiski/redis:/data:rw
      - /home/misskey/sushiski/.config/redis.conf:/usr/local/etc/redis/redis.conf:ro

    env_file:
      - .config/docker.env

    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      retries: 20

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sushiski_internal_network
      - sushiski_external_network

  meilisearch:
    image: getmeili/meilisearch:v1.3.4
    container_name: sushiski-meilisearch
    restart: always

    ports:
      - "7700:7700"

    env_file:
      - .config/docker.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_HTTP_ADDR: 0.0.0.0:7700

    volumes:
      - /home/misskey/sushiski/meili_data:/meili_data:rw

    working_dir: /meili_data
    entrypoint: ["tini", "--"]
    command: ["/bin/sh", "-c", "/bin/meilisearch"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sushiski_internal_network
      - sushiski_external_network

  # NSFW 推論サイドカー (Misskey 2026.7.0+)。ホスト公開せず内部ネットワークのみ。
  # コントロールパネル設定例:
  #   API URL: http://sensitive-detector:3009/
  #   API Key: .config/sensitive-detector.env の SENSITIVE_DETECTOR_API_KEY
  sensitive-detector:
    build:
      context: /home/misskey/sensitive-detector
      target: runtime
    image: sushiski-sensitive-detector:latest
    container_name: sushiski-sensitive-detector
    restart: unless-stopped
    env_file:
      - .config/sensitive-detector.env
    volumes:
      - /home/misskey/sushiski/.config/sensitive-detector.config.mjs:/config/config.mjs:ro
    healthcheck:
      test: ["CMD", "node", "/scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sushiski_internal_network


  # --- monitoring (localhost only; use SSH tunnel) ---
  # Grafana:    ssh -L 3001:127.0.0.1:3001 user@host  → http://127.0.0.1:3001
  # Prometheus: ssh -L 9090:127.0.0.1:9090 user@host  → http://127.0.0.1:9090
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: sushiski-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /home/misskey/sushiski/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/misskey/sushiski/prometheus_data:/prometheus:rw
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.0.2
    container_name: sushiski-grafana
    restart: unless-stopped
    env_file:
      - .config/monitoring.env
    environment:
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /home/misskey/sushiski/grafana_data:/var/lib/grafana:rw
      - /home/misskey/sushiski/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: sushiski-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: sushiski-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: sushiski-blackbox
    restart: unless-stopped
    command:
      - --config.file=/config/blackbox.yml
    volumes:
      - /home/misskey/sushiski/monitoring/blackbox.yml:/config/blackbox.yml:ro
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring
      # web:3000/healthz を直接叩くため
      - sushiski_internal_network

  misskey-queue-exporter:
    build: ./monitoring/misskey-queue-exporter
    container_name: sushiski-queue-exporter
    restart: unless-stopped
    # Misskey worker/master の /proc を読む（RSS / anonymous ≈ heap）
    pid: "service:web"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    env_file:
      - .config/docker.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_PREFIX: sushi.ski
      QUEUES: deliver,inbox
      PORT: "9101"
      PROCESS_WINDOW_SEC: "10"
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring
      - sushiski_internal_network
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

  nginx-log-exporter:
    build: ./monitoring/nginx-log-exporter
    container_name: sushiski-nginx-log-exporter
    restart: unless-stopped
    environment:
      NGINX_METRICS_LOG: /var/log/nginx/misskey/metrics.log
      PORT: "4040"
    volumes:
      - /home/misskey/sushiski/nginx/logs:/var/log/nginx/misskey:ro
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring
    depends_on:
      - nginx


networks:
  sushiski_internal_network:
    external: true
  sushiski_external_network:
    external: true
  monitoring:
    driver: bridge
