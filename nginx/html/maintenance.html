<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>すしすきー — メンテナンス中</title>
	<style>
		:root {
			--foam: #f6f1e7;
			--muted: rgba(246, 241, 231, 0.82);
			--accent: #c4e0c0;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			min-height: 100%;
			height: 100%;
		}

		body {
			font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Hiragino Sans",
				"Noto Sans JP", sans-serif;
			color: var(--foam);
			line-height: 1.65;
			display: grid;
			place-items: end stretch;
			min-height: 100dvh;
			background-color: #1a1510;
			background-image:
				linear-gradient(
					180deg,
					rgba(18, 14, 10, 0.25) 0%,
					rgba(18, 14, 10, 0.45) 40%,
					rgba(12, 10, 8, 0.88) 100%
				),
				url("./hero.webp");
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
		}

		main {
			width: min(36rem, 100%);
			padding: 2.5rem 1.5rem 3rem;
			margin: 0 auto;
			text-align: center;
			animation: rise 0.8s ease-out both;
		}

		.tag {
			display: inline-block;
			font-size: 0.75rem;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: var(--accent);
			margin-bottom: 0.85rem;
		}

		h1 {
			font-size: clamp(2rem, 7vw, 2.75rem);
			font-weight: 700;
			letter-spacing: 0.08em;
			text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
			margin-bottom: 0.85rem;
		}

		p {
			color: var(--muted);
			font-size: 1.05rem;
			text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
			margin-bottom: 0.4rem;
		}

		p.sub {
			font-size: 0.92rem;
			opacity: 0.9;
			margin-bottom: 0;
		}

		@keyframes rise {
			from { opacity: 0; transform: translateY(1rem); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			main { animation: none; }
		}
	</style>
</head>
<body>
	<main>
		<p class="tag">maintenance</p>
		<h1>すしすきー</h1>
		<p>ただいまメンテナンス中です。</p>
		<p class="sub">予定: 14:45〜15:15（約30分）</p>
		<p class="sub">しばらくしてから、もう一度アクセスしてください。</p>
	</main>
</body>
</html>
